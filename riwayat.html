<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1053d4">
  <title>Riwayat - Bos UMKM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="css/responsive.css?v=2">
</head>
<body>

  <!-- Container Smartphone Simulator -->
  <main class="app-viewport" id="appViewport">

    <!-- Header Riwayat (Sesuai Foto Pengguna) -->
    <header class="app-header" style="padding-bottom: 24px;">
      <div class="header-top-row">
        <div class="brand-wrapper">
          <div class="brand-title">Riwayat</div>
          <div class="store-subtitle btn-switch-store" id="storeSelector" title="Klik untuk ganti toko" style="cursor:pointer;">
            <span class="store-name-text">Toko Berkah Mandiri</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn btn-trigger-support" title="Bantuan CS">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
              <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
            </svg>
          </button>
          <button class="icon-btn btn-trigger-notif" title="Notifikasi">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
            </svg>
            <span class="badge-dot"></span>
          </button>
        </div>
      </div>

      <!-- Kolom Pencarian Transaksi -->
      <div class="search-scan-wrapper">
        <span class="search-prefix-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input type="text" id="historySearchInput" class="search-scan-input" placeholder="Cari transaksi / nama pelanggan...">
      </div>
    </header>

    <!-- Konten Riwayat -->
    <div class="app-content" style="margin-top: 0; padding-top: 10px; padding-bottom: 110px;">
      <div class="filter-tabs" style="margin-top: 10px;">
        <div class="filter-tab active" data-tx-filter="all">Semua</div>
        <div class="filter-tab" data-tx-filter="sale">Penjualan</div>
        <div class="filter-tab" data-tx-filter="expense">Pengeluaran</div>
        <div class="filter-tab" id="btnToggleEmptyHistory" style="color:#d97706; font-weight:800;">Mode Kosong (Foto)</div>
      </div>

      <!-- Daftar Transaksi Real -->
      <div class="transactions-container" id="historyTransactionsList"></div>

      <!-- Empty State Container Sesuai Sketsa Foto Pengguna -->
      <div class="empty-state-box" id="historyEmptyState" style="display:none;">
        <div class="empty-state-illustration">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <h3 class="empty-state-title">Belum ada riwayat</h3>
        <p class="empty-state-desc">
          catat stok masuk, keluar atau audit maka akan muncul di sini
        </p>
        <button class="btn-download-excel" id="btnDownloadExcelEmpty">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>Download Excel</span>
        </button>
      </div>

      <!-- Tombol Download Excel -->
      <div id="historyActionRow" style="margin-top: 16px; text-align: center;">
        <button class="btn-download-excel" id="btnDownloadExcel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>Download Excel</span>
        </button>
      </div>
    </div>

    <!-- Bottom Navigation Bar Melengkung -->
    <nav class="bottom-nav-container" aria-label="Navigasi Utama">
      <a href="index.html" class="nav-item" title="Beranda">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Beranda</span>
      </a>

      <a href="daftar-barang.html" class="nav-item" title="Toko & Gudang">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 3h18v18H3z"></path>
          <path d="M3 9h18"></path>
          <path d="M9 21V9"></path>
        </svg>
        <span>Gudang</span>
      </a>

      <div class="center-profile-anchor">
        <a href="akun.html" class="center-profile-ring" title="Profil Pemilik">
          <div class="center-profile-inner">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
        </a>
      </div>

      <a href="riwayat.html" class="nav-item active" title="Riwayat Transaksi">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Riwayat</span>
      </a>

      <a href="akun.html" class="nav-item" title="Pengaturan">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span>Setting</span>
      </a>
    </nav>

    <!-- Modal Drawer Container -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-drawer">
        <div class="drawer-drag-handle"></div>
        <div class="modal-header">
          <h3 class="modal-title" id="modalTitle">Judul Modal</h3>
          <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
  </main>

  <script src="js/api.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
